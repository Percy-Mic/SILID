<!doctype html>
<meta charset="utf-8">
<title>ref viewer</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  img{width:100vw;height:100vh;object-fit:contain;display:block;filter:brightness(3.2) contrast(1.15) saturate(1.3)}
  #cap{position:fixed;left:8px;bottom:8px;color:#0f0;font:14px monospace;background:#000a;padding:2px 8px;z-index:9}
</style>
<img id="im">
<div id="cap"></div>
<script>
  const n = new URLSearchParams(location.search).get('n') || '1';
  document.getElementById('im').src = `/_refs/${n}.png`;
  document.getElementById('cap').textContent = `ref ${n}`;
</script>
