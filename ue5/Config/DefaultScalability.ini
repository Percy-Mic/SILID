[/Script/Engine.RendererSettings]
; Low-end survival recipe for the Intel HD 4600. Forward shading removes the
; deferred GBuffer pressure that hung the device; shadows/GI/SSR off remove
; the per-light cost of 348 practicals. Keep flashlight semantics.
